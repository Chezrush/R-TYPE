name: Bug report
description: Report something that does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine
        - Protocol
        - Game logic
        - Server
        - Client
        - Build / CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start `r-type_server`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "git rev-parse --short HEAD"
  - type: textarea
    id: logs
    attributes:
      label: Logs / crash output
      render: shell
