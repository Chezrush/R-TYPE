name: Feature / task
description: Propose a new feature, an improvement or a task
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Engine
        - Protocol
        - Game logic
        - Server
        - Client
        - Documentation
        - CI/CD / tooling
        - Accessibility
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be done, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done?
      placeholder: |
        - [ ] ...
        - [ ] Tests added
        - [ ] Docs / protocol updated
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, design notes, related issues.
