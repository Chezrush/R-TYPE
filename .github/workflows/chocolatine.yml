name: Build/test
run-name: ${{ github.actor }} - R-Type CI

on:
  pull_request:
    branches-ignore:
      - "ga-ignore-*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # ccache is only used on Linux (poor MSVC support); empty = disabled.
      CMAKE_C_COMPILER_LAUNCHER: ${{ startsWith(matrix.os, 'ubuntu') && 'ccache' || '' }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ startsWith(matrix.os, 'ubuntu') && 'ccache' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: ./.github/actions/setup-vcpkg

      - name: Cache compiler output (ccache)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-${{ runner.os }}
          max-size: 500M

      - name: Configure
        shell: bash
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure --output-junit test-results.xml

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r-type-${{ runner.os }}
          path: |
            build/release/bin/r-type_server*
            build/release/bin/r-type_client*
          if-no-files-found: error
          retention-days: 7

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: build/release/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  sanitizers:
    name: ASan / UBSan (server + libraries)
    runs-on: ubuntu-latest
    env:
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: ./.github/actions/setup-vcpkg
        with:
          with-graphics-libs: "false"

      - name: Cache compiler output (ccache)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitizers
          max-size: 300M

      - name: Configure
        run: >
          cmake --preset server-only
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build --preset server-only

      - name: Test
        run: ctest --preset server-only --output-on-failure --output-junit sanitizer-results.xml
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1

      - name: Upload sanitizer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-results
          path: |
            build/server-only/sanitizer-results.xml
            build/server-only/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
