name: Lint
run-name: ${{ github.actor }} - lint check

on:
  pull_request:
    branches-ignore:
      - "ga-ignore-*"
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format (pinned, same version as local)
        run: pip install clang-format==23.1.3

      - name: Check formatting
        run: |
          FILES=$(git ls-files 'engine/*' 'protocol/*' 'game/*' 'server/*' 'client/*' 'tests/*' \
            | grep -E '\.(cpp|hpp|h)$' || true)
          if [ -z "$FILES" ]; then echo "No C++ files."; exit 0; fi
          # Unified diff of what clang-format would change, kept as an artifact.
          : > clang-format.diff
          for f in $FILES; do
            clang-format --style=file "$f" | diff -u --label "a/$f" --label "b/$f" "$f" - >> clang-format.diff || true
          done
          if [ -s clang-format.diff ]; then
            cat clang-format.diff
            echo "::error::Formatting issues found. Fix with: clang-format --style=file -i <file>"
            exit 1
          fi

      - name: Upload formatting diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clang-format-diff
          path: clang-format.diff
          retention-days: 7

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - uses: ./.github/actions/setup-vcpkg
        with:
          with-graphics-libs: "false"

      - name: Install clang-tidy (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: clang-tidy
          version: 1.0

      - name: Configure (server-only, exports compile_commands.json)
        run: cmake --preset server-only

      - name: Run clang-tidy
        run: |
          # Render and Resources need SFML: they are linted by clang-tidy-render.
          FILES=$(git ls-files 'engine/src/*.cpp' 'engine/src/**/*.cpp' 'protocol/src/*.cpp' \
            'game/src/*.cpp' 'server/src/*.cpp' \
            ':(exclude)engine/src/Render/*' ':(exclude)engine/src/Resources/*')
          set -o pipefail
          clang-tidy -p build/server-only --warnings-as-errors='*' $FILES 2>&1 | tee clang-tidy.log

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy.log
          if-no-files-found: ignore
          retention-days: 7

  # The SFML sources (UI rendering, resources) need the graphics libraries, so
  # they are linted in their own job, and only when a pull request touches them.
  # The job always runs (and succeeds when skipped) so it can be a required check.
  clang-tidy-render:
    name: clang-tidy (render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes in the render sources
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "Not a pull request: linting the render sources."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PATTERN='^(engine/(src|include/Engine)/(Render|Resources)/|engine/include/Engine/Ecs/Components/UI|\.clang-tidy$|\.github/workflows/lint\.yml$)'
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change in the render sources: nothing to lint."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changes.outputs.run == 'true'
        uses: lukka/get-cmake@latest

      - if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup-vcpkg

      - name: Install clang-tidy (cached)
        if: steps.changes.outputs.run == 'true'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: clang-tidy
          version: 1.0

      - name: Configure (debug with SFML, exports compile_commands.json)
        if: steps.changes.outputs.run == 'true'
        run: cmake --preset debug

      - name: Run clang-tidy on the render sources
        if: steps.changes.outputs.run == 'true'
        run: |
          FILES=$(git ls-files 'engine/src/Render/*.cpp' 'engine/src/Resources/*.cpp')
          set -o pipefail
          clang-tidy -p build/debug --warnings-as-errors='*' $FILES 2>&1 | tee clang-tidy-render.log

      - name: Upload clang-tidy report
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-render-report
          path: clang-tidy-render.log
          if-no-files-found: ignore
          retention-days: 7
