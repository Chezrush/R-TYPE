name: Mirror CI/CD
run-name: ${{ github.actor }} mirrors R-Type to Epitech

on:
  push:
    branches:
      - main

env:
  MIRROR_URL: "git@github.com:EpitechPGE3-2026/G-ING-500-PAR-5-1-rtype-13.git"

jobs:
  mirror:
    name: Push mirror to Epitech
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
